<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A run-and-gun. Find the sunglasses and see who is really running the city." />
    <title>They Live</title>
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="touch">
      <div id="stick"><div id="knob"></div></div>
      <div class="btn" id="btn-glasses" data-button="glasses" aria-label="Sunglasses">
        <svg viewBox="0 0 24 12" aria-hidden="true"><path d="M1 2h22v2h-1l-1 6h-6l-1.5-4h-3L9 10H3L2 4H1z" /></svg>
      </div>
      <div class="btn" id="btn-portal" data-button="portal" aria-label="Portal device">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 7 0 1 0 .01 0zm0 3a6.5 4 0 1 1-.01 0zm0 2.5a3 1.6 0 1 0 .01 0z" fill-rule="evenodd" /></svg>
      </div>
      <div class="btn" id="btn-tackle" data-button="tackle"><span>&#x00BB;</span><small>TACKLE</small></div>
      <div class="btn" id="btn-lock" data-button="lock" aria-label="Lock and aim">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 1h2v4.1A7 7 0 0 1 18.9 11H23v2h-4.1A7 7 0 0 1 13 18.9V23h-2v-4.1A7 7 0 0 1 5.1 13H1v-2h4.1A7 7 0 0 1 11 5.1zm1 6a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 3.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z" /></svg>
        <small>LOCK</small>
      </div>
      <div class="btn" id="btn-fire" data-button="fire"><span>B</span><small>FIRE</small></div>
      <div class="btn" id="btn-jump" data-button="jump"><span>A</span><small>JUMP</small></div>
    </div>
    <div id="rotate">TURN YOUR PHONE SIDEWAYS</div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
