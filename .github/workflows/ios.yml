name: Build iOS

# Builds the iPhone version on a Mac:
# 1. exports the Xcode project from Godot (preset "iOS"),
# 2. builds it for iPhones (unsigned) - this must succeed - and, as an extra
#    check, for the iPhone Simulator, launching it there to see it runs,
# 3. if the Apple secrets below exist, archives a signed build and uploads it
#    to App Store Connect / TestFlight.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID              your 10-character Apple Developer Team ID
#   ASC_KEY_ID                 App Store Connect API key: Key ID
#   ASC_ISSUER_ID              App Store Connect API key: Issuer ID
#   ASC_KEY_P8                 the downloaded AuthKey_XXXX.p8 file: open it as text
#                              and paste all of it (base64 of the file also works)
#
# (Mac build minutes are free for public repositories; on a private one they
# count 10x against GitHub's free allowance.)
#
# GitHub's Macs are sometimes hard to get, so this is normally started by
# "Build iOS (find a Mac)" (ios-dispatch.yml), which tries one Mac type after
# another until one actually starts. You can also start it here directly and
# pick the Mac type yourself.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight (needs the Apple secrets)
        type: boolean
        default: true
      runner:
        description: Mac type (runner label)
        type: string
        default: macos-26

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  ios:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Godot 4.7's iOS engine is built against the iOS 26 SDK, so it needs
      # Xcode 26 or newer; Macs often default to an older Xcode.
      - name: Select Xcode 26 or newer
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$xcode" ] && xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::This Mac has no Xcode 26 or newer (it has: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')). Use a newer Mac type."
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-mac
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-ios

      - name: Install Godot and the iOS export template
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot-mac
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d ~/godot-mac
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz 'templates/ios.zip' 'templates/version.txt' -d "$dest"
          rm templates.tpz
          ls -la "$dest"

      - name: Import the project (also fetches the AdMob plugin's iOS library)
        timeout-minutes: 10
        run: |
          GODOT=~/godot-mac/Godot.app/Contents/MacOS/Godot
          "$GODOT" --headless --path . --import || true
          ls addons/admob/ios/bin/ads/libs
          test -d addons/admob/ios/bin/ads/libs/poing-godot-admob-ads.release.xcframework

      - name: Run the tests
        timeout-minutes: 10
        run: ~/godot-mac/Godot.app/Contents/MacOS/Godot --headless --path . -s res://tests/run_tests.gd

      - name: Set the version and team
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Every build gets a higher build number, so App Store Connect takes it.
          # The version players see comes from the VERSION file; the build
          # number counts up by itself.
          version=$(tr -d '[:space:]' < VERSION)
          sed -i '' "s/^application\/version=\".*\"/application\/version=\"${{ github.run_number }}\"/; s/^application\/short_version=\".*\"/application\/short_version=\"$version\"/" export_presets.cfg
          # Godot won't export without a team ID. Until the real one is a secret,
          # a placeholder does for the unsigned simulator build.
          team="${APPLE_TEAM_ID:-SIMULATOR0}"
          sed -i '' "s/^application\/app_store_team_id=\".*\"/application\/app_store_team_id=\"$team\"/" export_presets.cfg
          grep -E "^application/(version|short_version|bundle_identifier|app_store_team_id)" export_presets.cfg

      - name: Export the Xcode project
        timeout-minutes: 15
        run: |
          GODOT=~/godot-mac/Godot.app/Contents/MacOS/Godot
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/TheyLive.ipa
          "$GODOT" --headless --path . -s res://tools/patch_ios_project.gd -- "$PWD/build/ios/TheyLive.xcodeproj"
          ls build/ios

      # The real check: the game builds and links for iPhones (arm64),
      # unsigned. The log is saved in full; the last lines are shown.
      - name: Build for iPhone (unsigned)
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild -project build/ios/TheyLive.xcodeproj -scheme TheyLive \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd-device CODE_SIGNING_ALLOWED=NO build > build/xcodebuild-device.log 2>&1 \
            || { grep -E "error:|Undefined symbols|ld: " build/xcodebuild-device.log | head -40; tail -60 build/xcodebuild-device.log; exit 1; }
          tail -5 build/xcodebuild-device.log

      # Godot's official simulator engine is Intel (x86_64) only, so the
      # simulator build is x86_64; on Apple Silicon Macs it runs through
      # Rosetta if the runner has it. An extra check: it reports, but can't
      # fail the build.
      - name: Build for the iPhone Simulator (Intel)
        id: simbuild
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild -project build/ios/TheyLive.xcodeproj -scheme TheyLive \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO EXCLUDED_ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO build > build/xcodebuild-sim.log 2>&1 \
            || { grep -E "error:|Undefined symbols|ld: " build/xcodebuild-sim.log | head -40; tail -40 build/xcodebuild-sim.log; exit 1; }
          tail -5 build/xcodebuild-sim.log

      - name: Launch test on the iPhone Simulator
        if: steps.simbuild.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ "$(uname -m)" = "arm64" ] && ! /usr/bin/pgrep -q oahd; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
          ./tools/ios_simulator_smoke_test.sh

      - name: Archive, sign and upload to TestFlight (needs the Apple secrets)
        if: inputs.upload
        timeout-minutes: 30
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::No Apple secrets yet, so no TestFlight upload this time."
            exit 0
          fi
          # The archive is built unsigned: a development signature would need a
          # registered iPhone. The export below signs it once, for the App
          # Store, with Apple's cloud-managed distribution certificate (the
          # API key must have Admin access).
          # Rebuild the .p8 file from the secret in exactly Apple's format,
          # whatever happened to it on the way in (Windows line endings, lost
          # line breaks, extra spaces, base64 of the whole file...).
          ASC_KEY_ID=$(echo "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(echo "$ASC_ISSUER_ID" | tr -d '[:space:]')
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_FILE="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 - "$KEY_FILE" <<'PY'
          import base64, os, re, sys
          raw = os.environ["ASC_KEY_P8"].replace("\r", "").strip()
          if "BEGIN" not in raw:
              try:
                  decoded = base64.b64decode(re.sub(r"\s+", "", raw)).decode("ascii", "ignore")
                  if "BEGIN" in decoded:
                      raw = decoded
              except Exception:
                  pass
          m = re.search(r"-----BEGIN [A-Z ]*PRIVATE KEY-----(.*?)-----END [A-Z ]*PRIVATE KEY-----", raw, re.S)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", m.group(1) if m else raw)
          try:
              key = base64.b64decode(body, validate=True)
          except Exception:
              sys.exit("::error::ASC_KEY_P8 doesn't look like the contents of the AuthKey_XXXX.p8 file. Open the file as text and paste all of it into the secret.")
          if len(key) < 100:
              sys.exit("::error::ASC_KEY_P8 is too short to be the .p8 key file (was the Key ID pasted there by mistake?).")
          lines = "\n".join(body[i:i + 64] for i in range(0, len(body), 64))
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + lines + "\n-----END PRIVATE KEY-----\n")
          print("API key file rebuilt (%d bytes of key data)." % len(key))
          PY
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::The API key in ASC_KEY_P8 isn't a valid private key. Download the .p8 again (or make a new key) and paste its whole text into the secret."
            exit 1
          fi
          if ! echo "$ASC_ISSUER_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "::warning::ASC_ISSUER_ID doesn't look like an Issuer ID (expected something like 69a6de7e-xxxx-xxxx-xxxx-xxxxxxxxxxxx)."
          fi
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_FILE"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          set -o pipefail
          xcodebuild -project build/ios/TheyLive.xcodeproj -scheme TheyLive \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/TheyLive.xcarchive "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive > build/xcodebuild-archive.log 2>&1 \
            || { grep -E "error:|Undefined symbols|ld: " build/xcodebuild-archive.log | head -40; tail -60 build/xcodebuild-archive.log; exit 1; }
          tail -5 build/xcodebuild-archive.log
          # With signing off, the embedded frameworks (Google Mobile Ads,
          # User Messaging Platform) end up unsigned, and the export only
          # re-signs code that already has a signature. Give everything a
          # placeholder (ad-hoc) signature, innermost first; the export
          # replaces it with the App Store distribution signature.
          APP_DIR=build/TheyLive.xcarchive/Products/Applications/TheyLive.app
          echo "Embedded code before signing:"
          find "$APP_DIR" \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" \) -print | sed 's/^/  /'
          find "$APP_DIR" -depth \( -name "*.dylib" -o -name "*.framework" -o -name "*.appex" \) -print0 \
            | while IFS= read -r -d '' item; do
                codesign --force --sign - --timestamp=none --preserve-metadata=identifier "$item"
              done
          codesign --force --sign - --timestamp=none --preserve-metadata=identifier \
            --entitlements build/ios/TheyLive/TheyLive.entitlements "$APP_DIR"
          codesign --verify --deep --strict "$APP_DIR" && echo "Placeholder signatures in place."
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/TheyLive.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/ipa "${AUTH[@]}" > build/xcodebuild-export.log 2>&1 \
            || { grep -E "error|Error" build/xcodebuild-export.log | head -40; tail -60 build/xcodebuild-export.log; exit 1; }
          tail -15 build/xcodebuild-export.log
          rm -f "$KEY_FILE"
          echo "::notice::Uploaded build ${{ github.run_number }} to App Store Connect. It shows up in TestFlight after Apple processes it (usually 5-30 minutes)."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-launch-test
          path: |
            build/ios-sim.png
            build/ios-sim-log.txt
            build/xcodebuild-device.log
            build/xcodebuild-sim.log
            build/xcodebuild-archive.log
            build/xcodebuild-export.log
          if-no-files-found: ignore
