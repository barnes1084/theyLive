name: Build Android APK

# Every push builds the APK (download it from the run's artifacts);
# pushes to main also publish it as a GitHub release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/stage.test.mjs
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk ../theylive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: theylive-apk
          path: theylive.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: They Live 1.0.${{ github.run_number }}
          body: |
            Download **theylive.apk** on your Android phone and open it to install.
          files: theylive.apk
