; They Live: default settings.
;
; Every value here is the setting's default: what a new player gets, and
; what RESET puts it back to. Change a number, save, and the next build
; uses it. A setting left out of this file uses the default in
; scripts/tune.gd. Values outside a setting's range are clamped.
;
; Tip: tune the game on your phone in the APK (developer settings), then
; tap COPY AS DEFAULTS in the settings and paste over this whole file.

[defaults]

; ---------- GAME ----------
; Game speed (0.5 to 1.5 ×)
gameSpeed=1
; New runs start at stage (1 to 20)
startStage=1
; Screen shake (0 to 2 ×)
shake=1
; Vibrate when you're hit (true / false)
vibrate=true
; Sound effects volume (0 to 1, as a fraction: 0.01 = 1%)
sfxVolume=0.8
; Music volume (0 to 1, as a fraction: 0.01 = 1%)
musicVolume=0.5
; Music speed (0.5 to 2 ×)
musicSpeed=1
; Banner ad at the top (true / false): takes effect on the next start
bannerAds=true
; Full-screen ad every (0 to 10 stages): 0 = never; shown before the next stage or retry
interstitialEvery=2

; ---------- CONTROLS ----------
; Move stick size (40 to 160 px)
stickSize=80
; Button size (0.6 to 1.6 ×)
buttonSize=1
; Button visibility (0.2 to 1, as a fraction: 0.01 = 1%)
buttonAlpha=0.6
; Buttons on the left, stick on the right (true / false)
swapSides=false

; ---------- HERO ----------
; Hearts (1 to 10)
maxHearts=4
; Hearts lost per hit (0 to 4): 0 = invincible
hitDamage=1
; Hearts lost falling in a pit (0 to 4)
pitDamage=1
; Hearts lost shooting an innocent (0 to 4)
innocentDamage=1
; Invincible after a hit (0 to 5 s)
invTime=1.6
; Start each stage with a hard hat (true / false)
startHardHat=false
; Run speed (1 to 2 ×)
runSpeed=1
; Jump power (1 to 1.5 ×)
jumpPower=1
; Gravity (0.6 to 1 ×): lower = floatier
gravity=1
; Tackle speed (100 to 400)
tackleSpeed=185
; Tackle length (0.1 to 1 s)
tackleTime=0.28
; Tackle cooldown (0 to 3 s)
tackleCooldown=0.7
; Tackle damage (1 to 20)
tackleDamage=3

; ---------- WEAPONS ----------
; Starting weapon ("G", "M", "N", "T", "S")
startWeapon="G"
; Keep weapon after game over (true / false)
keepWeapon=false
; Bullet speed (0.5 to 2 ×)
bulletSpeed=1
; Bullet range (0.5 to 3 ×)
bulletRange=1
; Spread gun: time between shots (0.05 to 1 s)
spreadDelay=0.36
; Spread gun: damage per pellet (0.25 to 10)
spreadDamage=1
; Spread gun: pellets (1 to 11)
spreadPellets=5
; Spread gun: spread (0.04 to 0.4 rad)
spreadAngle=0.16
; Machine gun: time between shots (0.03 to 0.5 s)
mgDelay=0.075
; Machine gun: damage (0.25 to 10)
mgDamage=1
; Machine gun: scatter (0 to 0.6 rad)
mgSweep=0.22
; Nail gun: time between shots (0.03 to 0.5 s)
nailDelay=0.1
; Nail gun: damage (0.25 to 10)
nailDamage=1
; Torch: time between puffs (0.02 to 0.3 s)
torchDelay=0.05
; Torch: damage (0.05 to 5)
torchDamage=0.45
; Slugs: time between shots (0.1 to 1.5 s)
slugDelay=0.42
; Slugs: damage (1 to 20)
slugDamage=5
; Slugs: enemies pierced (0 to 10)
slugPierce=2
; Sewer lizard drop chance (0 to 1, as a fraction: 0.01 = 1%)
dropChance=0.09

; ---------- SHADES & PORTAL ----------
; Shades last (1 to 120 s)
shadesTime=6
; Shades last with contacts (1 to 120 s)
contactsTime=12
; Shades full recharge (0.5 to 20 s)
shadesRecharge=4
; Start each stage with the shades (true / false)
startShades=false
; Start each stage with the portal (true / false)
startPortal=false
; Portal cooldown (0 to 5 s)
portalCooldown=1.2

; ---------- LIZARDS ----------
; Lizard health (0.25 to 5 ×)
enemyHp=1
; Lizard speed (0.3 to 2.5 ×)
enemySpeed=1
; Lizard fire rate (0.25 to 4 ×)
enemyFireRate=1
; Lizard shot speed (0.4 to 2.5 ×)
enemyShotSpeed=1
; Sewer ambushes (0.25 to 4 ×)
waveRate=1
; Disguise drops within (0 to 200 px)
revealDistance=70
; Disguise drops after (0.05 to 3 s)
revealTime=0.45
; Child snatchers (0 to 3 ×): 0 = none
snatchRate=1
; Snatcher escapes after running (4 to 60 tiles)
snatchEscape=18

; ---------- MOLOCH ----------
; Idol health (0.1 to 5 ×)
bossHp=1
; Idol speed (0.3 to 3 ×)
bossSpeed=1
; Idol attack rate (0.3 to 3 ×)
bossAttackRate=1
; Cultists at the ceremony (0 to 12): 0 = more each stage, up to 8
cultists=0

; ---------- SCORE ----------
; Points per lizard (0 to 1000)
lizardPoints=100
; Points for saving a child (0 to 5000)
savedPoints=500
; Penalty for losing a child (0 to 5000)
lostPoints=1000
; Penalty for shooting an innocent (0 to 5000)
innocentPoints=500
; Points for destroying the idol (0 to 20000)
bossPoints=5000
